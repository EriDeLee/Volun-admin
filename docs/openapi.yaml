components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: volun_session
      description: 服务端设置的 HttpOnly/SameSite=Lax Cookie；生产要求 Secure。
  parameters:
    RequestedWith:
      in: header
      name: X-Requested-With
      required: true
      schema: {type: string, enum: [XMLHttpRequest]}
      description: 同源前端自定义请求头，禁止跨源凭据 CORS。
  responses:
    AuthOK:
      description: 当前用户及设密状态；登录成功时设置会话 Cookie。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/Auth'}
    ProjectOK:
      description: 项目基础信息。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: {$ref: '#/components/schemas/Project'}
    BadRequest:
      description: 参数不合法，errcode 为 100001。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: 会话失效 200001，或账号密码不可用 200003。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 无访问权限 200002、请求头校验失败 200008，或首次设密未完成 200009。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    InternalError:
      description: 内部错误 900001；不向客户端返回数据库或上游敏感详情。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    WorkflowBasics:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        department:
          type: string
        starts_on:
          type: string
        ends_on:
          type: string
        location:
          type: string
        description:
          type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSession'
    WorkflowSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        start:
          type: string
        end:
          type: string
        positions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowPosition'
    WorkflowPosition:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        capacity:
          type: integer
          minimum: 0
        description:
          type: string
        hours:
          allOf:
          - type: integer
            minimum: 0
          nullable: true
    WorkflowApplication:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        kind:
          type: string
        status:
          type: string
        basics:
          $ref: '#/components/schemas/WorkflowBasics'
        applicant:
          type: string
        reviewer:
          type: string
        reason:
          type: string
        review_reason:
          type: string
        reviewed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    WorkflowMember:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        number:
          type: string
        department:
          type: string
        phone:
          type: string
        session_id:
          type: string
        position_id:
          type: string
        source:
          type: string
        intent:
          type: string
        platform:
          type: string
    WorkflowState:
      type: object
      additionalProperties: false
      properties:
        basics:
          $ref: '#/components/schemas/WorkflowBasics'
        draft:
          allOf:
          - $ref: '#/components/schemas/WorkflowBasics'
          nullable: true
        applications:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowApplication'
        members:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowMember'
        windows:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowWindow'
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowAttendance'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowHour'
        form:
          $ref: '#/components/schemas/WorkflowForm'
        intent_form:
          $ref: '#/components/schemas/WorkflowForm'
        material:
          $ref: '#/components/schemas/WorkflowMaterial'
        review:
          $ref: '#/components/schemas/WorkflowReview'
        legacy:
          type: boolean
    WorkflowForm:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        published:
          type: boolean
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
    WorkflowWindow:
      type: object
      additionalProperties: false
      properties:
        session_id:
          type: string
        action:
          type: string
        mode:
          type: string
        open:
          type: boolean
        start:
          type: string
        end:
          type: string
        token:
          type: string
    WorkflowAttendance:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        member_id:
          type: string
        session_id:
          type: string
        action:
          type: string
        source:
          type: string
        reason:
          type: string
        actor:
          type: string
        at:
          type: string
          format: date-time
    WorkflowHour:
      type: object
      additionalProperties: false
      properties:
        member_id:
          type: string
        hours:
          allOf:
          - type: integer
            minimum: 0
          nullable: true
        recognized:
          allOf:
          - type: integer
            minimum: 0
          nullable: true
        reason:
          type: string
        source:
          type: string
    WorkflowReview:
      type: object
      additionalProperties: false
      properties:
        external_result:
          type: string
        opinion:
          type: string
        published:
          type: boolean
        snapshot:
          type: string
        approved_at:
          allOf:
          - type: string
            format: date-time
          nullable: true
    WorkflowMaterial:
      type: object
      additionalProperties: false
      properties:
        team:
          type: string
        audience:
          type: string
        registration_start:
          type: string
        registration_end:
          type: string
        checkin_rule:
          type: string
        checkin_start:
          type: string
        checkin_end:
          type: string
        max_daily_hours:
          allOf:
          - type: integer
            minimum: 0
          nullable: true
        recruitment:
          type: string
        password:
          type: string
        guarantees:
          type: array
          items:
            type: string
        other_guarantee:
          type: string
        description:
          type: string
        contact_name:
          type: string
        contact_phone:
          type: string
        contact_mobile:
          type: string
        contact_email:
          type: string
        notes:
          type: string
        training:
          type: string
    WorkflowResult:
      type: object
      additionalProperties: false
      properties:
        project:
          $ref: '#/components/schemas/Project'
        version:
          type: integer
          minimum: 0
        approval:
          type: string
          enum:
          - draft
          - pending
          - approved
          - returned
        state:
          $ref: '#/components/schemas/WorkflowState'
        capabilities:
          type: array
          items:
            type: string
    WorkflowHoursRequest:
      type: object
      additionalProperties: false
      properties:
        rows:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/WorkflowHour'
    WorkflowMembersRequest:
      type: object
      additionalProperties: false
      properties:
        members:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/WorkflowMember'
        reason:
          type: string
    WorkflowBasicsRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
        basics:
          $ref: '#/components/schemas/WorkflowBasics'
        reason:
          type: string
    WorkflowVersionRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
    WorkflowDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 0
        decision:
          type: string
          enum:
          - approved
          - returned
        reason:
          type: string
    WorkflowAccessRequest:
      type: object
      additionalProperties: false
      properties:
        member_id:
          type: string
        username:
          type: string
        revoke:
          type: boolean
        reason:
          type: string
    WorkflowFormRequest:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - recruit
          - intent
        published:
          type: boolean
        title:
          type: string
        description:
          type: string
        deadline:
          type: string
        rotate:
          type: boolean
    WorkflowAttendanceRequest:
      type: object
      additionalProperties: false
      properties:
        member_id:
          type: string
        action:
          type: string
          enum:
          - checkin
          - checkout
          - absent
        reason:
          type: string
        correction:
          type: boolean
    WorkflowTransitionRequest:
      type: object
      additionalProperties: false
      properties:
        status:
          $ref: '#/components/schemas/ProjectStatus'
        reason:
          type: string
        external_result:
          type: string
    WorkflowRegistrationRequest:
      type: object
      additionalProperties: false
      properties:
        member:
          $ref: '#/components/schemas/WorkflowMember'
        key:
          type: string
          minLength: 16
          maxLength: 80
    WorkflowCredentialRequest:
      type: object
      additionalProperties: false
      properties:
        credential:
          type: string
    WorkflowOwnUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        department:
          type: string
        phone:
          type: string
        intent:
          type: string
        platform:
          type: string
    WorkflowScanRequest:
      type: object
      additionalProperties: false
      properties:
        token:
          type: string
    WorkflowHistory:
      type: object
      additionalProperties: false
      properties:
        events:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              version:
                type: integer
                minimum: 0
              action:
                type: string
              actor:
                type: string
              reason:
                type: string
              created_at:
                type: string
                format: date-time
        materials:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id:
                type: string
              version:
                type: integer
                minimum: 0
              filename:
                type: string
              checksum:
                type: string
              template_checksum:
                type: string
              created_at:
                type: string
                format: date-time
    WorkflowPublicForm:
      type: object
      additionalProperties: false
      properties:
        project:
          type: string
        kind:
          type: string
        form:
          $ref: '#/components/schemas/WorkflowForm'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSession'
    WorkflowOwnResult:
      type: object
      additionalProperties: false
      properties:
        member:
          $ref: '#/components/schemas/WorkflowMember'
        project:
          type: string
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowSession'
        attendance:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowAttendance'
        hours:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowHour'
    WorkflowRegistrationResult:
      type: object
      additionalProperties: false
      properties:
        member:
          $ref: '#/components/schemas/WorkflowMember'
        credential:
          type: string
    WorkflowVerified:
      type: object
      additionalProperties: false
      properties:
        verified:
          type: boolean
    WorkflowScanContext:
      type: object
      additionalProperties: false
      properties:
        project:
          type: string
        session_id:
          type: string
        action:
          type: string
        member:
          allOf:
            - $ref: '#/components/schemas/WorkflowMember'
          nullable: true
    Envelope:
      type: object
      required: [errcode, message, data, request_id]
      properties:
        errcode: {type: integer, example: 0}
        message: {type: string, example: ok}
        request_id: {type: string}
    Error:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data: {nullable: true, example: null}
    User:
      type: object
      required: [id, name, username, groups]
      properties:
        id: {type: string, description: 学号或人员编号，保留前导零。}
        name: {type: string}
        username: {type: string}
        groups:
          type: array
          items:
            type: string
            enum: [super_admin, data_admin, activity_admin, formal_user]
    Auth:
      type: object
      required: [user, auth_method, password_setup_required]
      properties:
        user: {$ref: '#/components/schemas/User'}
        auth_method: {type: string, enum: [password, session, sso]}
        password_setup_required: {type: boolean}
    ProjectStatus:
      type: string
      enum: [立项, 筹备, 招募, 进行, 结项, 意向, 统计, 数据, 录入, 审核, 通过, 驳回]
    CreateProject:
      type: object
      required: [name, department, starts_on, ends_on, location]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        department: {type: string, minLength: 1, maxLength: 80}
        starts_on: {type: string, format: date}
        ends_on: {type: string, format: date}
        location: {type: string, minLength: 1, maxLength: 160}
        description: {type: string, maxLength: 2000, default: ''}
    Project:
      allOf:
        - $ref: '#/components/schemas/CreateProject'
        - type: object
          required: [id, code, status, owner_name, created_at, updated_at]
          properties:
            id: {type: string}
            code: {type: string, example: ZY-20261108-9B3B289DAFA1}
            approval: {type: string, enum: [draft, pending, approved, returned]}
            status: {$ref: '#/components/schemas/ProjectStatus'}
            owner_name: {type: string, description: 当前活动负责人；非数据组审核负责人。}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    ProjectList:
      type: object
      required: [items, total, page, page_size, summary, departments, scope]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/Project'}
        total: {type: integer, format: int64, minimum: 0, description: 筛选后的项目总数。}
        page: {type: integer, minimum: 1, maximum: 1000000}
        page_size: {type: integer, minimum: 1, maximum: 100}
        scope: {type: string, enum: [owned, all]}
        departments:
          type: array
          description: 权限范围内全部主办部门，去重、升序排列，不受关键词和状态筛选影响。
          items: {type: string}
        summary:
          type: object
          description: 权限范围内全部时间、筛选前的项目统计。
          required: [project_count, recruiting_count, pending_count, recognized_hours]
          properties:
            project_count: {type: integer, format: int64, minimum: 0}
            recruiting_count: {type: integer, format: int64, minimum: 0}
            pending_count: {type: integer, format: int64, minimum: 0}
            recognized_hours: {type: integer, nullable: true, description: 首页小时汇总尚未接入，返回 null。}
    Dashboard:
      type: object
      required: [scope, generated_at, summary, tasks, recent_projects, stages]
      properties:
        scope: {type: string, enum: [owned, all], description: owned 为本人项目，all 为超管全部项目。}
        generated_at: {type: string, format: date-time}
        summary:
          type: object
          required: [project_count, recruiting_count, pending_count, recognized_hours]
          properties:
            project_count: {type: integer, format: int64, minimum: 0}
            recruiting_count: {type: integer, format: int64, minimum: 0}
            pending_count: {type: integer, format: int64, minimum: 0}
            recognized_hours: {type: integer, nullable: true, description: 首页小时汇总尚未接入，当前为 null。}
        tasks:
          type: array
          maxItems: 5
          items:
            type: object
            required: [project_id, project_name, status, instruction]
            properties:
              project_id: {type: string}
              project_name: {type: string}
              status: {$ref: '#/components/schemas/ProjectStatus'}
              instruction: {type: string}
        recent_projects:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/Project'}
        stages:
          type: array
          description: 每种状态均返回一条，含计数 0 的状态；十二状态总数等于 project_count。
          minItems: 12
          maxItems: 12
          items:
            type: object
            required: [status, count]
            properties:
              status: {$ref: '#/components/schemas/ProjectStatus'}
              count: {type: integer, format: int64, minimum: 0}

    AdminUser:
      type: object
      required: [username, name, id, groups, status, password_setup_required, has_password, created_at, updated_at]
      properties:
        username: {type: string, description: 平台登录账号；管理接口的稳定键。}
        name: {type: string}
        id: {type: string, description: 学号或人员编号，保留前导零；不是 sub。}
        groups:
          type: array
          minItems: 0
          items:
            type: string
            enum: [super_admin, data_admin, activity_admin, formal_user]
        status: {type: string, enum: [active, disabled]}
        password_setup_required: {type: boolean}
        has_password: {type: boolean, description: 是否已设置平台密码；不返回哈希。}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AdminUserList:
      type: object
      required: [items, total, page, page_size, summary]
      properties:
        items:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/AdminUser'}
        total: {type: integer, format: int64, minimum: 0}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1, maximum: 100}
        summary:
          type: object
          required: [user_count, active_count, disabled_count, manager_count]
          properties:
            user_count: {type: integer, format: int64, minimum: 0}
            active_count: {type: integer, format: int64, minimum: 0}
            disabled_count: {type: integer, format: int64, minimum: 0}
            manager_count: {type: integer, format: int64, minimum: 0, description: 拥有超管、数据管理员或活动管理员任一用户组的账号数。}
    UpdateAdminUser:
      type: object
      properties:
        status: {type: string, enum: [active, disabled]}
        groups:
          type: array
          minItems: 1
          items:
            type: string
            enum: [super_admin, data_admin, activity_admin, formal_user]
      description: 至少提供 status 或 groups 之一。
