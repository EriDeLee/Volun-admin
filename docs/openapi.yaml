openapi: 3.0.3
info:
  title: 志愿服务平台 API
  version: 0.6.0
  description: |
    本文覆盖认证、用户管理、项目台账、立项审批及持久化工作流。详细职责见 task-02-project-workflow.md。
    首页仅聚合已持久化的项目信息，不以演示数据填充生产页面。
    超管查看全部项目；活动管理员仅查看本人项目；数据管理员共享已提交项目，草稿除外。
    用户管理仅超管可访问，列表与更新均不返回 sub、密码摘要或上游令牌。
    新建项目初始状态为立项。报名不产生时长，保存时长或下载材料不推进项目状态。
    首页 recognized_hours 汇总暂未接入，仍为 null；工作流可读取独立的小时记录。
    JSON 接口返回统一信封；SSO 发起和回调返回浏览器重定向。
    本地会话使用 HttpOnly Cookie。
servers:
  - url: /
    description: 同源服务；开发时前端通过 Vite 代理 /api
tags:
  - name: Auth
    description: 已实现的认证接口；不包含尚未实现的 CSRF 令牌签发、资料编辑和找回密码。
  - name: Activity
    description: 活动管理员首页、分页项目台账、新建立项及基础详情。
  - name: Admin
    description: 超管用户目录；分配四个固定用户组、启停账号。不包含部门字典与邀请注册。
  - name: Workflow
    description: 管理端写请求要求版本头；数据管理员负责审批及批准后的数据工作，活动管理员负责本人基础信息及现场出勤。
  - name: WorkflowPublic
    description: 公开问卷及本人凭证访问，不授予后台权限；限流120次每分钟，拒绝缓存。
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 账号密码登录
      security: []
      description: 校验启用账号及 bcrypt 密码，成功签发平台 Cookie。管理员添加、导入或重置密码后的账号可凭临时密码登录，但必须先设置新密码才能使用业务功能；尚无平台密码的SSO账号先经统一认证设置密码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password, writeOnly: true}
      responses:
        '200':
          $ref: '#/components/responses/AuthOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 读取当前身份及首次设密状态
      security: [{sessionCookie: []}]
      description: 允许未完成首次设密的有效会话访问。auth_method 当前返回 session，不推断原始登录方式。
      responses:
        '200':
          $ref: '#/components/responses/AuthOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 退出当前平台会话
      security: []
      description: 清除平台 Cookie 并撤销对应会话；无 Cookie 时也返回成功，不退出学校其他系统。
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {nullable: true, example: null}
  /api/v1/auth/setup-password:
    post:
      tags: [Auth]
      operationId: setupInitialPassword
      summary: SSO 首次登录设置平台密码
      security: [{sessionCookie: []}]
      description: |
        仅接受 password_setup_required=true 的启用账号。
        服务端校验 UTF-8 字节数为 12–72，保存 bcrypt 哈希并原子清除标记。
        要求自定义请求头；服务不允许跨源凭据 CORS。旧账号不会被此接口覆盖密码。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  format: password
                  writeOnly: true
                  description: 12–72 UTF-8 字节；不是 JSON Schema 字符数限制。
      responses:
        '200':
          $ref: '#/components/responses/AuthOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 已设置密码，errcode 为 200010。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/sso/start:
    get:
      tags: [Auth]
      operationId: startSSO
      summary: 发起学校统一认证
      security: []
      description: 浏览器整页导航，不应使用 fetch 换取上游令牌。
      parameters:
        - in: query
          name: return_to
          schema: {type: string, default: /}
          description: 站内相对路径；不合法路径回退 /。新用户强制进入 /set-password。
      responses:
        '302':
          description: 跳转学校授权地址。
          headers:
            Location: {schema: {type: string}}
        '303':
          description: 配置缺失或发起失败，回到前端 /login?sso=unavailable 或 error。
          headers:
            Location: {schema: {type: string}}
  /auth/sso/callback:
    get:
      tags: [Auth]
      operationId: ssoCallback
      summary: 学校 SSO 后端回调
      security: []
      description: |
        实际注册路径不带 /api/v1。后端校验一次性 state、换取令牌并读取用户信息。
        新建正式用户首次需设置密码；失败返回 /login?sso=failed。
        code 和 state 不记录到访问日志，不由前端处理。
      parameters:
        - in: query
          name: code
          schema: {type: string}
        - in: query
          name: state
          schema: {type: string}
        - in: query
          name: error
          schema: {type: string}
      responses:
        '303':
          description: 登录完成或失败后跳转前端；成功设置会话 Cookie。
          headers:
            Location: {schema: {type: string}}
  /api/v1/activity/dashboard:
    get:
      tags: [Activity]
      operationId: getActivityDashboard
      summary: 读取活动管理首页
      security: [{sessionCookie: []}]
      description: |
        需要 activity_admin、data_admin 或 super_admin，且已完成首次设密。
        统计口径为全部时间、当前权限范围内的项目，不伪称本学期统计。
        待办为立项/筹备/招募/结项/意向阶段的项目，每项目一个跟进任务，最新更新优先。
        recent_projects 最多 12 条，tasks 最多 5 条；统计为全部授权项目，不仅是返回的列表。
      responses:
        '200':
          description: 首页聚合数据；无项目时数组为空、项目计数为 0。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/Dashboard'}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity/projects:
    get:
      tags: [Activity]
      operationId: listActivityProjects
      summary: 分页查询项目台账
      security: [{sessionCookie: []}]
      description: |
        需要 activity_admin、data_admin 或 super_admin，且已完成首次设密。
        活动管理员仅查询本人创建的项目；超管查询全部项目。
        q 按项目名称或编号进行字面子串搜索，% 和 _ 不作为通配符。
        status、department、view 与关键词组合筛选；按 updated_at DESC、id DESC 排序。
        total 是筛选后的总数；summary 和 departments 是筛选前、权限范围内全部项目的信息。
        pending 包含立项、筹备、招募、结项、意向，不代表独立审核工单。
        不返回内部用户 sub 或 created_by。首页小时汇总未接入，recognized_hours 返回 null。
        page 和 page_size 非整数、越界，或状态/视图不合法时返回 400；超出结果页返回空 items。
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 160}
          description: 项目名称或编号的字面子串；去除首尾空白。
        - in: query
          name: status
          schema: {$ref: '#/components/schemas/ProjectStatus'}
          description: 留空或省略表示全部状态。
        - in: query
          name: department
          schema: {type: string, maxLength: 80}
          description: 主办部门精确匹配；去除首尾空白，留空表示全部部门。
        - in: query
          name: view
          schema: {type: string, enum: [all, pending], default: all}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 分页项目及权限范围内统计；无项目时数组为空、总数为 0。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/ProjectList'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Activity]
      operationId: createActivityProject
      summary: 新建项目立项
      security: [{sessionCookie: []}]
      description: |
        角色与首页一致。仅允许指定基础字段，不接受负责人、用户组或状态注入。
        状态固定为立项，创建人即当前活动负责人；不产生志愿者或时长。
        日期按日期保存，不伪造时刻；结束日期不得早于开始日期。
        请求体最多 16 KiB；首次实现为单部门，后续多部门与协作授权单独扩展。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProject'}
      responses:
        '200':
          $ref: '#/components/responses/ProjectOK'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity/projects/{id}:
    get:
      tags: [Activity]
      operationId: getActivityProject
      summary: 读取项目基础详情
      security: [{sessionCookie: []}]
      description: 活动管理员只能读取本人项目；数据管理员读取全部已提交项目；超管读取全局。不存在或不在范围内返回 404。
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/ProjectOK'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 项目不存在或不在授权范围。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users:
    post:
      tags: [Admin]
      operationId: createAdminUser
      summary: 手动新增单个成员
      security: [{sessionCookie: []}]
      description: 仅超管。共享CSV导入校验，重复账号不覆盖，初次登录强制设密。请求体最多8KiB，返回同批量导入结构，valid=false表示校验失败且未创建。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, name, id, password]
              properties:
                username: {type: string, maxLength: 120}
                name: {type: string, maxLength: 80}
                id: {type: string, maxLength: 120}
                password: {type: string, format: password, writeOnly: true, description: 12至72字节}
                groups: {type: array, items: {type: string, enum: [super_admin, data_admin, activity_admin, formal_user]}}
      responses:
        '200':
          description: 校验及创建结果，包含valid、imported、rows，与批量导入响应一致。
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Admin]
      operationId: listAdminUsers
      summary: 分页查询用户目录
      security: [{sessionCookie: []}]
      description: |
        需要 super_admin，且已完成首次设密。
        q 按登录账号、姓名或学号/人员编号做字面子串搜索，% 和 _ 不作为通配符。
        status、group 与关键词组合筛选；按 updated_at DESC、username ASC 排序。
        total 是筛选后的总数；summary 是筛选前全库用户统计。
        不返回 sub、密码摘要或会话标识。page 与 page_size 非法时返回 400。
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 160}
          description: 账号、姓名或学号/人员编号的字面子串；去除首尾空白。
        - in: query
          name: status
          schema: {type: string, enum: [active, disabled]}
          description: 留空表示全部状态。
        - in: query
          name: group
          schema:
            type: string
            enum: [super_admin, data_admin, activity_admin, formal_user]
          description: 拥有该用户组的账号；一人可属多组。
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 分页用户及全库摘要。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/AdminUserList'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/import:
    post:
      tags: [Admin]
      operationId: importAdminUsers
      summary: 预检或批量新增平台成员
      security: [{sessionCookie: []}]
      description: |
        仅超管可用。JSON请求体最多256KiB，CSV必须为UTF-8（允许BOM），表头为账号,姓名,学号,初始密码,用户组，每批1至100行。
        初始密码12至72字节，用户组使用固定代码，以 | 分隔，空值默认formal_user。
        commit=false只预检；commit=true重新校验并原子写入，任何行无效则整批不写入，账号已存在不会覆盖。
        密码不返回、不以明文存储。新账号首次登录需设置新密码。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [csv]
              properties:
                csv: {type: string, writeOnly: true}
                commit: {type: boolean, default: false}
      responses:
        '200':
          description: 预检结果；valid=false表示存在逐行错误，imported始终为0。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          valid: {type: boolean}
                          imported: {type: integer}
                          rows:
                            type: array
                            items:
                              type: object
                              properties:
                                line: {type: integer}
                                username: {type: string}
                                name: {type: string}
                                id: {type: string}
                                groups: {type: array, items: {type: string}}
                                error: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/activity/approvals:
    get:
      tags: [Workflow]
      operationId: listProjectApprovals
      summary: 分页读取待审批的立项及基础信息变更申请
      security: [{sessionCookie: []}]
      description: 仅数据管理员及超管可用；包含已批准项目的待审变更。按项目ID、项目内申请顺序稳定分页。
      parameters:
        - in: query
          name: q
          schema: {type: string, maxLength: 160}
        - in: query
          name: page
          schema: {type: integer, minimum: 1, maximum: 1000000, default: 1}
        - in: query
          name: page_size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 待审申请列表，审批操作使用详情工作流的当前版本。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: {type: integer}
                          page: {type: integer}
                          page_size: {type: integer}
                          items:
                            type: array
                            items:
                              type: object
                              properties:
                                project: {$ref: '#/components/schemas/Project'}
                                application: {$ref: '#/components/schemas/WorkflowApplication'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{username}/reset-password:
    post:
      tags: [Admin]
      operationId: resetAdminUserPassword
      summary: 设置成员临时密码并强制下次改密
      security: [{sessionCookie: []}]
      description: 仅超管。密码摘要更新、标记需设密及撤销全部现有会话在同一事务提交。保持账号状态及用户组。不能重置当前账号或用户名对应多个身份的账号。请求体最多8KiB。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - in: path
          name: username
          required: true
          schema: {type: string, maxLength: 120}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string, format: password, writeOnly: true, description: 12至72字节}
      responses:
        '200':
          description: 返回成员公开信息，不含临时密码。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/AdminUser'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 成员不存在。
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/admin/users/{username}:
    patch:
      tags: [Admin]
      operationId: updateAdminUser
      summary: 更新用户组或账号状态
      security: [{sessionCookie: []}]
      description: |
        需要 super_admin。路径参数为登录账号 username，不是 sub。
        可单独或同时更新 status 与 groups；至少提供一项。
        groups 仅允许四个固定用户组，去重后按固定顺序保存，至少保留一组。
        禁止停用当前登录超管自身，禁止去掉自身的 super_admin。
        停用账号时撤销该用户全部未失效会话。请求体最多 8 KiB。
      parameters:
        - $ref: '#/components/parameters/RequestedWith'
        - in: path
          name: username
          required: true
          schema: {type: string, maxLength: 120}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAdminUser'}
      responses:
        '200':
          description: 更新后的用户公开信息。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: {$ref: '#/components/schemas/AdminUser'}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 用户不存在。
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
